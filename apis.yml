name: Homeboodle
description: >-
  Homeboodle was a San Francisco rental marketplace startup that rebranded as "Lovely" around 2012.
  The product let renters search, apply for, and pay for apartments online, while giving landlords and
  property managers tools to list units, screen applicants, and collect rent. Backed by 500 Startups
  (now 500 Global) among other investors, Lovely (livelovely.com) was acquired by RentPath (the owner
  of Apartment Guide and Rent.com) for roughly $13M in April 2014. The company is now defunct as an
  independent product; livelovely.com issues a 301 redirect to apartmentguide.com and the former
  developer/API surface (hub.livelovely.com) is offline. This record is retained for historical and
  network-graph completeness rather than as an active API provider.
